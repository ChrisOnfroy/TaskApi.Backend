services:
  postgres:
    image: postgres:17-alpine
    container_name: taskapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskapi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - taskapi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskapi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  taskapi-pgdata:
